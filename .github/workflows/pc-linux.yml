name: Linux PC build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 meson ninja-build nasm \
            flex bison pkg-config libsdl2-dev libenet-dev libsoundtouch-dev
      - name: Check generators and runtime packaging
        run: python3 -m unittest discover -s pc/tools/tests
      - name: Build executable and asset extractor
        run: |
          make -f Makefile.pc linux GAME_VERSION=HEARTGOLD JOBS=4
          meson compile -C build/pc/heartgold -j 4 hg-extract
      - name: Stage runtime files and shared libraries
        run: >-
          python3 pc/tools/package_runtime.py --platform linux --game heartgold
          --build build/pc/heartgold --output build/pc/heartgold/package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-HEARTGOLD
          path: build/pc/heartgold/package/
          if-no-files-found: error
